[project]
name = "dataops-comisiones"
version = "1.0.0"
description = "Pipeline DataOps: salario total = salario (PostgreSQL) + comisión (CSV en Blob) -> Parquet en Data Lake"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
